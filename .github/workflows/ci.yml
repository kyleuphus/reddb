name: CI

on: push

jobs:


  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        c_compiler: [gcc, clang]
        exclude:
          - os: ubuntu-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc

    steps: 
    - name: install redis (linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install redis-server -y
  
    - name: install redis (macos)
      if: runner.os == 'macOS'
      run: brew install redis

    - uses: actions/checkout@v4

    - name: Build
      run: make CC=${{ matrix.c_compiler }} sanitize

    - name: run aof_restart
      run: | 
        ./tests/aof_restart.sh | tee aof.out 
        grep -q 'ALL PASSED' aof.out

    - name: smoke test
      run: |
        mkdir -p smoke && cd smoke 
        ../reddb 6380 > server.log 2>&1 &
        SERVER=$!
        for i in $(seq 50); do
          redis-cli -p 6380 PING && break
          sleep 0.1
        done
        redis-benchmark -p 6380 -t set,get -n 20000 -c 50 -q
        cat server.log



